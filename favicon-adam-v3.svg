<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d5b7"/>
      <stop offset="100%" style="stop-color:#d4a574"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" rx="16" fill="url(#bg)"/>
  
  <!-- Version 3: Modern minimalist A with serifs -->
  <!-- Left stroke -->
  <line x1="32" y1="70" x2="48" y2="26" 
        stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
  <!-- Right stroke -->
  <line x1="52" y1="26" x2="68" y2="70" 
        stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
  <!-- Crossbar -->
  <line x1="38" y1="54" x2="62" y2="54" 
        stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <!-- Top serif - subtle -->
  <line x1="44" y1="26" x2="56" y2="26" 
        stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</svg>