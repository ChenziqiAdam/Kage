<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d5b7"/>
      <stop offset="100%" style="stop-color:#d4a574"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" rx="16" fill="url(#bg)"/>
  
  <!-- Version 2: A inside a circle frame -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.4"/>
  
  <!-- A with filled negative space -->
  <path d="M30 68 L50 28 L70 68 L60 68 L50 48 L40 68 Z" 
