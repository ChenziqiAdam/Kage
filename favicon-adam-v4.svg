<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d5b7"/>
      <stop offset="100%" style="stop-color:#d4a574"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" rx="16" fill="url(#bg)"/>
  
  <!-- Version 4: A with circular/continuity motif (subtle nod to "expand the edge") -->
  <!-- Outer ring with gap at top -->
  <path d="M50 12 A38 38 0 1 1 49.9 12" 
        fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- A in center -->
  <path d="M36 64 L50 30 L64 64" 
        fill="none" stroke="url(#accent)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="42" y1="50" x2="58" y2="50" 
        stroke="url(#accent)" stroke-width="3.5" stroke-linecap="round"/>
</svg>